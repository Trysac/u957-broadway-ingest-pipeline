# Semgrep CE rules owned by the factory (MIT, like this repository). The semgrep gate in scripts/check.exs runs only
# this file; Semgrep-maintained registry rules are never used (their license forbids distribution and service use).
# Every rule is ERROR: a match fails the gate. Factory-owned file: agents must not edit it.
#
# Semgrep CE does not parse Elixir (the Elixir parser needs Semgrep Pro), so the rules use the generic engine with
# regular expressions over .ex and .exs files; a match inside a comment or a string counts too. Credo's Warning
# checks (UnsafeExec, UnsafeToAtom) cover part of the same ground in the lint gate.
rules:
  - id: fabrica.elixir.code-eval
    languages: [generic]
    paths:
      include: ["*.ex", "*.exs"]
    severity: ERROR
    message: Code.eval_string, Code.eval_quoted, Code.eval_file and Code.compile_string run their input as Elixir code. Interpret the input explicitly instead.
    pattern-regex: \bCode\.(?:eval_string|eval_quoted|eval_quoted_with_env|eval_file|compile_string|compile_quoted|require_file)\s*\(
  - id: fabrica.elixir.shell-exec
    languages: [generic]
    paths:
      include: ["*.ex", "*.exs"]
    severity: ERROR
    message: Running a command line through a shell (:os.cmd, System.shell, Port.open with :spawn, or System.cmd of sh -c) allows command injection. Use System.cmd with the program and its arguments as separate strings instead.
    pattern-either:
      - pattern-regex: :os\.cmd\s*\(
      - pattern-regex: \bSystem\.shell\s*\(
      - pattern-regex: \bPort\.open\s*\(\s*\{\s*:spawn\s*,
      - pattern-regex: \bSystem\.cmd\s*\(\s*"(?:/bin/|/usr/bin/)?(?:sh|bash|zsh|dash|cmd|cmd\.exe|powershell|pwsh)"\s*,\s*\[\s*"(?:-c|/c|/C|-Command)"
  - id: fabrica.elixir.unsafe-deserialization
    languages: [generic]
    paths:
      include: ["*.ex", "*.exs"]
    severity: ERROR
    message: :erlang.binary_to_term without the :safe option can create atoms and executable funs from the input (atom exhaustion, code injection). Pass [:safe], or decode a data format such as JSON instead.
    pattern-either:
      - pattern-regex: :erlang\.binary_to_term\s*\(\s*[^,()]+\s*\)
      - pattern-regex: :erlang\.binary_to_term\s*\([^)]*,\s*\[\s*\]\s*\)
  - id: fabrica.elixir.atom-from-input
    languages: [generic]
    paths:
      include: ["*.ex", "*.exs"]
    severity: ERROR
    message: Atoms are never garbage collected, so creating them from input (String.to_atom, List.to_atom, :erlang.binary_to_atom) can exhaust the atom table and crash the node. Use String.to_existing_atom or map the input over an explicit list of allowed atoms.
    pattern-either:
      - pattern-regex: \b(?:String|List)\.to_atom\s*\(
      - pattern-regex: :erlang\.(?:binary_to_atom|list_to_atom)\s*\(
      - pattern-regex: \|>\s*(?:String|List)\.to_atom\b
  - id: fabrica.elixir.dynamic-apply
    languages: [generic]
    paths:
      include: ["*.ex", "*.exs"]
    severity: ERROR
    message: apply/3 or Kernel.apply/3 with a function name that is not a literal atom lets the input choose which function runs. Dispatch over an explicit list of allowed functions instead.
    pattern-regex: \b(?:Kernel\.)?apply\s*\(\s*[^,()]+,\s*(?!:)[a-z_][A-Za-z0-9_]*\s*,
  - id: fabrica.elixir.tls-verification-disabled
    languages: [generic]
    paths:
      include: ["*.ex", "*.exs"]
    severity: ERROR
    message: TLS certificate verification is disabled (verify_none), so any server can impersonate the real one.
    pattern-regex: :verify_none\b
  - id: fabrica.elixir.hardcoded-secret
    languages: [generic]
    paths:
      include: ["*.ex", "*.exs"]
    severity: ERROR
    message: A credential (private key, AKIA access key, GitHub, Slack or Stripe token) is hard-coded in the source. Read it from the environment.
    pattern-either:
      - pattern-regex: -----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----
      - pattern-regex: \b(AKIA|ASIA)[0-9A-Z]{16}\b
      - pattern-regex: \bgh[pousr]_[A-Za-z0-9]{36}\b
      - pattern-regex: \bxox[baprs]-[A-Za-z0-9-]{10,}\b
      - pattern-regex: \bsk_live_[A-Za-z0-9]{24,}\b
